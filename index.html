<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Tool | Wan2.1 VACE</title>
<meta name="description" content="Genereer video's met Wan2.1-VACE-14B via Hugging Face">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-orbs"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>

<main class="shell">
  <header class="brand">
    <div class="logo">JD</div>
    <div>
      <h1>Video Tool</h1>
      <p class="sub">Wan2.1-VACE-14B · Hugging Face Space</p>
    </div>
    <button id="themeToggle" class="ghost" title="Thema wisselen">◐</button>
  </header>

  <section class="card glass">
    <label class="field">
      <span>Prompt</span>
      <textarea id="prompt" rows="3" placeholder="Beschrijf de video die je wilt genereren…"></textarea>
    </label>

    <details class="advanced">
      <summary>Geavanceerd</summary>
      <label class="field">
        <span>Negatieve prompt</span>
        <textarea id="negative" rows="2"></textarea>
      </label>
      <div class="grid3">
        <label class="field"><span>Resolutie</span>
          <select id="size">
            <option value="480x832">480 × 832</option>
            <option value="576x1024">576 × 1024</option>
            <option value="720x1280" selected>720 × 1280</option>
            <option value="832x480">832 × 480</option>
            <option value="1024x576">1024 × 576</option>
            <option value="1280x720">1280 × 720</option>
          </select>
        </label>
        <label class="field"><span>Frames</span>
          <input id="frames" type="number" value="49" min="17" max="81" step="4">
        </label>
        <label class="field"><span>Steps</span>
          <input id="steps" type="number" value="25" min="10" max="50">
        </label>
        <label class="field"><span>Guidance</span>
          <input id="cfg" type="number" value="5" min="1" max="10" step="0.5">
        </label>
        <label class="field"><span>Seed (-1 = random)</span>
          <input id="seed" type="number" value="-1">
        </label>
      </div>
    </details>

    <button id="generate" class="primary">Genereer video</button>
    <p id="status" class="status" role="status"></p>
  </section>

  <section id="resultCard" class="card glass hidden">
    <video id="video" controls playsinline></video>
    <a id="download" class="ghost" download="video-tool.mp4">Download MP4</a>
  </section>

  <footer class="foot">Backend: HF Space <code id="spaceName"></code> · geen Google API meer</footer>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
